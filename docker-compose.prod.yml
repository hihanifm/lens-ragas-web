services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "37100:37100"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
