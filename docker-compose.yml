services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "37100:37100"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "37101:37101"
    environment:
      - VITE_API_PROXY_TARGET=http://api:37100
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
